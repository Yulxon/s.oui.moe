---
- name: Provision Hysteria2 and SearXNG on Debian 13
  hosts: "{{ deployment_hosts | default('vultr') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - name: Verify the supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_major_version'] | int >= 13
        fail_msg: This project supports Debian 13 or newer only.
    - name: Validate required deployment settings
      ansible.builtin.assert:
        that:
          - public_domain | length > 0
          - acme_email | length > 0
          - hysteria_auth_password | length >= 16
          - searxng_secret_key | length >= 32
        fail_msg: >-
          Set public_domain, acme_email, hysteria_auth_password (16+ chars), and
          searxng_secret_key (32+ chars) in vaulted variables.
  roles:
    - role: warp
      when: warp_enabled | default(false)
      tags: warp
    - common
    - searxng
    - hysteria
