---
- name: Update APT package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present

- name: Read current system timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: common_current_timezone
  check_mode: false
  changed_when: false

- name: Set system timezone
  ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
  changed_when: common_current_timezone.stdout != timezone
  when: common_current_timezone.stdout != timezone

- name: Allow only required inbound firewall traffic
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible
      # Never use "flush ruleset" here: Docker maintains its own nftables
      # compatibility tables for NAT and published ports.
      destroy table inet ansible_filter
      table inet ansible_filter {
        chain input {
          type filter hook input priority filter; policy drop;
          ct state established,related accept
          iif lo accept
          ip protocol icmp accept
          ip6 nexthdr ipv6-icmp accept
          tcp dport {{ admin_ssh_port }} accept
          tcp dport { 80, 443 } accept
          udp dport { {{ hysteria_listen_ports }} } accept
        }
        chain forward {
          type filter hook forward priority filter; policy drop;
          # Preserve outbound connectivity for unrelated Docker workloads.
          ip saddr 172.16.0.0/12 accept
          ip daddr 172.16.0.0/12 ct state established,related accept
        }
        chain output { type filter hook output priority filter; policy accept; }
      }
  register: common_nftables_config
  notify:
    - Reload nftables

- name: Remove legacy globally managed firewall table  # noqa no-handler
  ansible.builtin.command: nft delete table inet filter
  register: common_legacy_nftables_table
  changed_when: common_legacy_nftables_table.rc == 0
  failed_when: common_legacy_nftables_table.rc not in [0, 1]
  when: common_nftables_config.changed and not ansible_check_mode

- name: Apply changed firewall rules  # noqa no-handler
  ansible.builtin.meta: flush_handlers
  when: common_nftables_config.changed

- name: Enable firewall
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Inspect UFW executable
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: common_ufw_binary

- name: Allow required Hysteria ports through existing UFW
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - allow
      - "{{ item }}"
  loop:
    - "{{ admin_ssh_port }}/tcp"
    - 80/tcp
    - 443/tcp
    - 443/udp
    - "{{ hysteria_listen_ports.split(',')[1] | replace('-', ':') }}/udp"
  register: common_ufw_rule
  changed_when: "'Rule added' in common_ufw_rule.stdout or 'Rules updated' in common_ufw_rule.stdout"
  when: common_ufw_binary.stat.exists and not ansible_check_mode
