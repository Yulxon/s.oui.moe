---
- name: Install SearXNG runtime packages
  ansible.builtin.apt:
    name:
      - docker-compose
      - docker.io
    state: present
    update_cache: true

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Create SearXNG directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /opt/searxng
    - /opt/searxng/config
    - /var/www/letsencrypt

- name: Write SearXNG settings
  ansible.builtin.template:
    src: settings.yml.j2
    dest: /opt/searxng/config/settings.yml
    owner: root
    group: root
    mode: '0600'
  notify: Restart SearXNG
  no_log: true
  diff: false

- name: Write SearXNG compose definition
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/searxng/compose.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart SearXNG

- name: Start SearXNG stack
  ansible.builtin.command:
    cmd: docker compose -f /opt/searxng/compose.yml up -d
  register: searxng_compose
  changed_when: >-
    'Started' in searxng_compose.stdout or
    'Created' in searxng_compose.stdout or
    'Recreated' in searxng_compose.stdout
