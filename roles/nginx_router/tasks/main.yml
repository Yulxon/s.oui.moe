---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    # Hysteria already owns TCP 80/443; configure loopback listeners first.
    policy_rc_d: 101

- name: Remove Debian public default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: nginx router changed

- name: Write local Host router
  ansible.builtin.template:
    src: router.conf.j2
    dest: /etc/nginx/conf.d/ansible-router.conf
    owner: root
    group: root
    mode: '0644'
  notify: nginx router changed

- name: Remove obsolete WebVPN htpasswd
  ansible.builtin.file:
    path: /etc/nginx/webvpn.htpasswd
    state: absent

- name: Enable Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Apply changed router configuration before checking routes
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: Check search Host route
  ansible.builtin.uri:
    url: "http://{{ http_router_host }}:{{ http_router_port }}/"
    headers:
      Host: "{{ searxng_domain }}"
    status_code: 200
  register: nginx_router_search_http
  retries: 15
  delay: 2
  until: nginx_router_search_http.status == 200
  changed_when: false
  when: not ansible_check_mode

- name: Check WebVPN Host route
  ansible.builtin.uri:
    url: "http://{{ http_router_host }}:{{ http_router_port }}/"
    headers:
      Host: "{{ webvpn_domain }}"
    status_code: 200
  changed_when: false
  when: not ansible_check_mode

- name: Check unknown Host rejection
  ansible.builtin.uri:
    url: "http://{{ http_router_host }}:{{ http_router_port }}/"
    headers:
      Host: unknown.invalid
    status_code: 421
  changed_when: false
  when: not ansible_check_mode
