---
- name: Create Hysteria configuration directory
  ansible.builtin.file:
    path: /etc/hysteria
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Hysteria2 binary
  ansible.builtin.get_url:
    url: "{{ hysteria_download_base_url }}/hysteria-linux-{{ hysteria_arch }}"
    dest: /usr/local/bin/hysteria
    owner: root
    group: root
    mode: '0755'
    timeout: 30
    # Set hysteria_download_checksum with a pinned release URL in production.
    checksum: "{{ hysteria_download_checksum | default(omit) }}"
  register: hysteria_download
  until: hysteria_download is succeeded
  retries: 3
  delay: 5
  notify: Restart Hysteria

- name: Write Hysteria2 server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/hysteria/config.yaml
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  notify: Restart Hysteria

- name: Install Hysteria2 systemd unit
  ansible.builtin.template:
    src: hysteria-server.service.j2
    dest: /etc/systemd/system/hysteria-server.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart Hysteria

- name: Apply Hysteria configuration before starting service
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: Enable Hysteria2 service
  ansible.builtin.systemd:
    name: hysteria-server.service
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Hysteria HTTPS readiness
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 443
    timeout: 180
  when: not ansible_check_mode
